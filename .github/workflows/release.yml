name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify SemVer tag
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          }
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - run: npm test
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
      - name: Validate packed artifact
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact" "$RUNNER_TEMP/package-consumer"
          npm pack --pack-destination "$RUNNER_TEMP/package-artifact"
          cd "$RUNNER_TEMP/package-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/package-artifact"/*.tgz
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
