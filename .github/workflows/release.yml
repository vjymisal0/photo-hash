name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (for example v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - run: npm test
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
      - name: Validate packed artifact
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact" "$RUNNER_TEMP/package-consumer"
          npm pack --pack-destination "$RUNNER_TEMP/package-artifact"
          cd "$RUNNER_TEMP/package-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/package-artifact"/*.tgz
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
